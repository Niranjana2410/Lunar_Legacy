<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Lunar Legacy</title>
  <script>
    // GitHub Pages SPA redirect.
    // When GitHub Pages returns a 404 for a deep path like /Lunar_Legacy/archive,
    // this script encodes the path into a query string and redirects to the root,
    // where index.html's inline script decodes it back so React Router can handle it.
    var l = window.location;
    var segmentCount = 1; // number of path segments in the repo name (/Lunar_Legacy)
    var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/' +
      '?p=/' + path +
      (l.search ? '&q=' + l.search.slice(1) : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
